[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrelease"
version = "0.1.0"
description = "Evaluate supplied agent test evidence against explicit release policies."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Dr. Felipe Castillo Rendón", email = "fcastillorendon@gmail.com"}]
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://lynvera.ai"
Repository = "https://github.com/lynvera-ai/agentrelease"
Issues = "https://github.com/lynvera-ai/agentrelease/issues"

[project.scripts]
agentrelease = "agentrelease.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2", "mypy>=2.4,<3", "types-PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentrelease = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/agentrelease", "tools"]
strict = true
